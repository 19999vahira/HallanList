<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Time Clock — Hallan Timesheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --nav-blue:#3E97E8;
    --nav-blue-dark:#2E7FD1;
    --ink:#37424A;
    --slate:#6B7684;
    --line:#E3E7EB;
    --page-bg:#F5F7F8;
    --green:#2FA86B;
    --red:#D9534F;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',sans-serif;color:var(--ink);background:var(--page-bg);}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;}

  .topnav{
    background:var(--nav-blue);color:#fff;display:flex;align-items:center;
    gap:26px;padding:0 24px;height:56px;flex-wrap:wrap;
  }
  .topnav .brand{font-weight:700;letter-spacing:.4px;font-size:15px;margin-right:8px;display:flex;align-items:center;gap:8px;}
  .topnav .brand svg{width:20px;height:20px;}
  .topnav nav{display:flex;gap:22px;flex:1;}
  .topnav nav a{
    font-size:13.5px;font-weight:600;letter-spacing:.3px;color:rgba(255,255,255,.85);
    padding:18px 2px;border-bottom:2px solid transparent;
  }
  .topnav nav a.active{color:#fff;border-bottom-color:#fff;}
  .topnav nav a:hover{color:#fff;}
  .topnav .right{display:flex;align-items:center;gap:16px;font-size:13px;color:rgba(255,255,255,.9);}
  .avatar-pill{
    width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.25);
    display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;
  }

  main{max-width:920px;margin:0 auto;padding:48px 24px 60px;}

  .clockcard{
    background:#fff;border:1px solid var(--line);border-radius:12px;
    padding:44px 36px;text-align:center;margin-bottom:28px;
  }
  .clockcard .clock{
    font-family:'JetBrains Mono',monospace;font-size:52px;font-weight:700;color:var(--ink);
    letter-spacing:1px;
  }
  .clockcard .date{color:var(--slate);font-size:14px;margin-top:6px;}
  .clockcard .status{
    display:inline-flex;align-items:center;gap:8px;margin-top:22px;padding:8px 16px;
    border-radius:20px;font-size:13px;font-weight:600;background:#EEF2F4;color:var(--slate);
  }
  .clockcard .status.on{background:#E5F6ED;color:var(--green);}
  .clockcard .status .dot{width:8px;height:8px;border-radius:50%;background:currentColor;}

  .clockbtn{
    margin-top:26px;border:none;border-radius:8px;padding:16px 44px;font-size:16px;font-weight:700;
    color:#fff;cursor:pointer;transition:.15s;
  }
  .clockbtn.in{background:var(--green);}
  .clockbtn.in:hover{background:#26955D;}
  .clockbtn.out{background:var(--red);}
  .clockbtn.out:hover{background:#C4433F;}

  .section-head{display:flex;align-items:center;justify-content:space-between;margin:0 0 14px;}
  .section-head h2{font-size:16px;margin:0;}
  .section-head .weeklabel{font-size:13px;color:var(--slate);}

  table.hours{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;}
  table.hours th, table.hours td{padding:12px 16px;text-align:left;font-size:13.5px;border-bottom:1px solid var(--line);}
  table.hours th{background:#FAFBFC;color:var(--slate);font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;font-weight:700;}
  table.hours tr:last-child td{border-bottom:none;}
  table.hours td.hrs{font-weight:700;}
  table.hours tfoot td{background:#FAFBFC;font-weight:700;}
</style>
</head>
<body>

<div class="topnav">
  <div class="brand">
    <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M20 2 L34 20 L20 38 L6 20 Z" stroke="#fff" stroke-width="2.6" fill="none"/>
      <path d="M20 10 L28 20 L20 30 L12 20 Z" fill="#fff"/>
    </svg>
    ROTA
  </div>
  <nav>
    <a href="../rota/schedule.html">Dashboard</a>
    <a href="../rota/schedule.html">Schedule</a>
    <a href="#">Tasks</a>
    <a href="#">Messages</a>
    <a href="#">Newsfeed</a>
    <a href="#">Reports</a>
    <a href="#" class="active">Time Clock</a>
  </nav>
  <div class="right">
    <span>Hallan Cash &amp; Carry</span>
    <div class="avatar-pill">HC</div>
  </div>
</div>

<main>
  <div class="clockcard">
    <div class="clock" id="clock">--:--:--</div>
    <div class="date" id="date">—</div>
    <div class="status" id="status"><span class="dot"></span> Clocked out</div>
    <div>
      <button class="clockbtn in" id="clock-btn">Clock In</button>
    </div>
  </div>

  <div class="section-head">
    <h2>This week's hours</h2>
    <span class="weeklabel" id="week-label">—</span>
  </div>
  <table class="hours">
    <thead>
      <tr><th>Day</th><th>Clock in</th><th>Clock out</th><th>Hours</th></tr>
    </thead>
    <tbody id="hours-body"></tbody>
    <tfoot>
      <tr><td colspan="3">Total this week</td><td class="hrs" id="week-total">0h 00m</td></tr>
    </tfoot>
  </table>
</main>

<script>
  // ---------------------------------------------------------------
  // Front-end mock. Wire clock-in/out to real endpoints, e.g.
  //   POST /api/timesheet/clock-in   -> { ok, started_at }
  //   POST /api/timesheet/clock-out  -> { ok, ended_at, hours }
  //   GET  /api/timesheet/week       -> { entries: [...] }
  // ---------------------------------------------------------------
  function tick(){
    const now = new Date();
    document.getElementById('clock').textContent = now.toLocaleTimeString('en-GB');
    document.getElementById('date').textContent = now.toLocaleDateString('en-GB', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
  }
  tick();
  setInterval(tick, 1000);

  let clockedIn = false;
  const btn = document.getElementById('clock-btn');
  const statusEl = document.getElementById('status');

  btn.addEventListener('click', () => {
    clockedIn = !clockedIn;
    if (clockedIn) {
      btn.textContent = 'Clock Out';
      btn.classList.remove('in'); btn.classList.add('out');
      statusEl.classList.add('on');
      statusEl.innerHTML = '<span class="dot"></span> Clocked in';
    } else {
      btn.textContent = 'Clock In';
      btn.classList.remove('out'); btn.classList.add('in');
      statusEl.classList.remove('on');
      statusEl.innerHTML = '<span class="dot"></span> Clocked out';
    }
  });

  // ---- Compute the REAL current week (Mon–Sun) instead of a hardcoded date ----
  function getMonday(d){
    const date = new Date(d);
    const day = date.getDay();
    const diff = day === 0 ? -6 : 1 - day;
    date.setDate(date.getDate() + diff);
    date.setHours(0,0,0,0);
    return date;
  }
  function addDays(d, n){ const r = new Date(d); r.setDate(r.getDate()+n); return r; }
  const DAY_NAMES = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const MONTH_NAMES = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const monday = getMonday(new Date());
  const sunday = addDays(monday, 6);
  document.getElementById('week-label').textContent =
    monday.getMonth() === sunday.getMonth()
      ? `${monday.getDate()} – ${sunday.getDate()} ${MONTH_NAMES[monday.getMonth()]}`
      : `${monday.getDate()} ${MONTH_NAMES[monday.getMonth()]} – ${sunday.getDate()} ${MONTH_NAMES[sunday.getMonth()]}`;

  // Mock rows for now — swap for a real GET /api/timesheet/week fetch when that's wired up.
  // Placeholder times shown on the first 3 real days of this week, rest blank.
  const rows = Array.from({length:7}, (_, i) => {
    const d = addDays(monday, i);
    const label = `${DAY_NAMES[i]} ${d.getDate()}`;
    if (i === 0) return [label, '8:58 AM', '5:02 PM', '8h 04m'];
    if (i === 1) return [label, '8:55 AM', '7:01 PM', '10h 06m'];
    if (i === 2) return [label, '9:02 AM', '7:00 PM', '9h 58m'];
    return [label, '—', '—', '—'];
  });
  const body = document.getElementById('hours-body');
  rows.forEach(r => {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td class="hrs">${r[3]}</td>`;
    body.appendChild(tr);
  });
  document.getElementById('week-total').textContent = '28h 08m';
</script>
</body>
</html>
