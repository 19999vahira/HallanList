<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Schedule — Hallan Rota</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --nav-blue:#3E97E8;
    --nav-blue-dark:#2E7FD1;
    --ink:#37424A;
    --slate:#6B7684;
    --line:#E3E7EB;
    --panel:#ffffff;
    --page-bg:#F5F7F8;

    /* shift-block palette, lifted from the Sling schedule screenshot */
    --chip-timeoff-bg:#9AA3AC;
    --chip-timeoff-fg:#ffffff;
    --chip-shift-bg:#F0A868;
    --chip-shift-fg:#5A3B12;
    --chip-highlight-bg:#EE8686;
    --chip-highlight-fg:#5D1717;
    --chip-invoice-bg:#B97A55;
    --chip-invoice-fg:#3B230F;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',sans-serif;color:var(--ink);background:var(--page-bg);}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;}

  /* ---- top nav ---- */
  .topnav{
    background:var(--nav-blue);color:#fff;display:flex;align-items:center;
    gap:26px;padding:0 24px;height:56px;flex-wrap:wrap;
  }
  .topnav .brand{font-weight:700;letter-spacing:.4px;font-size:15px;margin-right:8px;display:flex;align-items:center;gap:8px;}
  .topnav .brand svg{width:20px;height:20px;}
  .topnav nav{display:flex;gap:22px;flex:1;}
  .topnav nav a{
    font-size:13.5px;font-weight:600;letter-spacing:.3px;color:rgba(255,255,255,.85);
    padding:18px 2px;border-bottom:2px solid transparent;
  }
  .topnav nav a.active{color:#fff;border-bottom-color:#fff;}
  .topnav nav a:hover{color:#fff;}
  .topnav .right{display:flex;align-items:center;gap:16px;font-size:13px;color:rgba(255,255,255,.9);}
  .avatar-pill{
    width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.25);
    display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;
  }

  /* ---- toolbar ---- */
  .toolbar{
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    background:#fff;border-bottom:1px solid var(--line);padding:12px 24px;
  }
  .toolbar .weeknav{display:flex;align-items:center;gap:8px;}
  .toolbar button.navbtn{
    width:30px;height:30px;border:1px solid var(--line);background:#fff;border-radius:6px;cursor:pointer;color:var(--slate);
  }
  .toolbar .weeklabel{font-weight:700;color:var(--nav-blue);font-size:15px;min-width:110px;text-align:center;}
  .toolbar .todaybtn{
    border:1px solid var(--line);background:#fff;border-radius:6px;padding:7px 14px;font-size:13px;color:var(--ink);cursor:pointer;
  }
  .toolbar .spacer{flex:1;}
  .toolbar .filter-chip{
    border:1px solid var(--line);background:#fff;border-radius:6px;padding:7px 14px;font-size:13px;
    color:var(--slate);display:flex;align-items:center;gap:6px;
  }
  .toolbar .create-shift{
    background:var(--nav-blue);color:#fff;border:none;border-radius:6px;padding:9px 18px;
    font-size:13.5px;font-weight:600;cursor:pointer;
  }
  .toolbar .create-shift:hover{background:var(--nav-blue-dark);}

  /* ---- schedule grid ---- */
  .gridwrap{overflow-x:auto;background:#fff;}
  table.schedule{border-collapse:collapse;width:100%;min-width:980px;}
  table.schedule th, table.schedule td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);}
  table.schedule thead th{
    background:#FAFBFC;color:var(--slate);font-size:11.5px;letter-spacing:.6px;text-transform:uppercase;
    padding:12px 10px;text-align:left;font-weight:700;position:sticky;top:0;
  }
  table.schedule thead th.namecol{position:sticky;left:0;z-index:2;background:#FAFBFC;min-width:200px;}
  table.schedule tbody td.namecol{
    position:sticky;left:0;background:#fff;z-index:1;padding:12px 14px;min-width:200px;
  }
  .employee{display:flex;align-items:center;gap:10px;}
  .employee .initials{
    width:32px;height:32px;border-radius:50%;background:#E7ECF0;color:var(--slate);
    display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:none;
  }
  .employee .meta .n{font-size:13.5px;font-weight:600;color:var(--ink);}
  .employee .meta .h{font-size:11.5px;color:var(--slate);margin-top:1px;}

  table.schedule td.daycell{padding:6px;vertical-align:top;min-width:130px;height:64px;}
  .chip{
    border-radius:5px;padding:6px 8px;font-size:11.5px;line-height:1.35;cursor:pointer;
  }
  .chip .t{font-weight:700;}
  .chip .l{opacity:.9;}
  .chip.timeoff{background:var(--chip-timeoff-bg);color:var(--chip-timeoff-fg);}
  .chip.shift{background:var(--chip-shift-bg);color:var(--chip-shift-fg);}
  .chip.highlight{background:var(--chip-highlight-bg);color:var(--chip-highlight-fg);}
  .chip.invoice{background:var(--chip-invoice-bg);color:var(--chip-invoice-fg);}

  tfoot td{
    background:#FAFBFC;font-size:11.5px;color:var(--slate);font-weight:700;padding:10px;
  }
  tfoot td.namecol{position:sticky;left:0;background:#FAFBFC;}
</style>
</head>
<body>

<div class="topnav">
  <div class="brand">
    <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M20 2 L34 20 L20 38 L6 20 Z" stroke="#fff" stroke-width="2.6" fill="none"/>
      <path d="M20 10 L28 20 L20 30 L12 20 Z" fill="#fff"/>
    </svg>
    ROTA
  </div>
  <nav>
    <a href="#">Dashboard</a>
    <a href="#" class="active">Schedule</a>
    <a href="#">Tasks</a>
    <a href="#">Messages</a>
    <a href="#">Newsfeed</a>
    <a href="#">Reports</a>
    <a href="../timesheet/">Time Clock</a>
  </nav>
  <div class="right">
    <span id="user-name">Hallan Cash &amp; Carry</span>
    <button id="logout-btn" style="background:none;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:6px;padding:6px 12px;font-size:12.5px;cursor:pointer;">Log out</button>
    <div class="avatar-pill" id="avatar-pill">HC</div>
  </div>
</div>

<div class="toolbar">
  <div class="weeknav">
    <button class="navbtn" id="prev-week">&lsaquo;</button>
    <div class="weeklabel" id="week-label">02 – 08 Mar</div>
    <button class="navbtn" id="next-week">&rsaquo;</button>
  </div>
  <button class="todaybtn">Today</button>
  <div class="spacer"></div>
  <div class="filter-chip">📍 All departments</div>
  <div class="filter-chip">👤 All staff</div>
  <button class="create-shift">+ Create shift</button>
</div>

<div class="gridwrap">
  <table class="schedule">
    <thead>
      <tr>
        <th class="namecol">Scheduled shifts</th>
        <th>Mon 2</th><th>Tue 3</th><th>Wed 4</th><th>Thu 5</th><th>Fri 6</th><th>Sat 7</th><th>Sun 8</th>
      </tr>
    </thead>
    <tbody id="grid-body"></tbody>
    <tfoot>
      <tr id="totals-row">
        <td class="namecol">Scheduled hours</td>
      </tr>
    </tfoot>
  </table>
</div>

<script>
  // ---------------------------------------------------------------
  // Auth guard — reuses the same JWT the Staff Portal login issues via
  // /api/staff/login (see rota/index.html). No separate rota login exists
  // on the backend; this page just requires that token to be present.
  // ---------------------------------------------------------------
  const API_BASE = 'https://hallan-picking-backend.onrender.com'; // same value as in rota/index.html
  const token = localStorage.getItem('rota_token');
  if (!token) {
    window.location.href = 'index.html';
  }
  document.getElementById('user-name').textContent = localStorage.getItem('rota_name') || 'Hallan Cash & Carry';
  const initialsFromName = (localStorage.getItem('rota_name') || 'HC').split(' ').map(p=>p[0]).slice(0,2).join('').toUpperCase();
  document.getElementById('avatar-pill').textContent = initialsFromName;
  document.getElementById('logout-btn').addEventListener('click', () => {
    localStorage.removeItem('rota_token');
    localStorage.removeItem('rota_name');
    localStorage.removeItem('rota_role');
    window.location.href = 'index.html';
  });
  // Optional: confirm the token is still valid by calling /api/staff/me.
  // If it's expired, bounce back to login rather than showing a broken page.
  fetch(`${API_BASE}/api/staff/me`, { headers: { Authorization: `Bearer ${token}` } })
    .then(r => { if (!r.ok) throw new Error('expired'); })
    .catch(() => { window.location.href = 'index.html'; });

  // ---------------------------------------------------------------
  // Static mock data for now — swap `employees` below for a real fetch
  // to your rota backend, e.g. GET /api/rota/weeks/:weekStart
  // ---------------------------------------------------------------
  const days = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

  const employees = [
    { name:'Aditi Rao',      role:'Cashier',        hours:'20h', shifts:[null,{t:'9:00 AM–1:30 PM',l:'Facing Up',type:'shift'},{t:'2:30 PM–7:00 PM',l:'Cashier 2 PM',type:'shift'},null,{t:'2:00 PM–7:00 PM',l:'Cashier 1 PM',type:'shift'},{t:'8:00 AM–2:00 PM',l:'Cashier 1 AM',type:'shift'},null] },
    { name:'Ben Coley',      role:'Warehouse',      hours:'0h',  shifts:[null,{t:'All day',l:'Time off',type:'timeoff'},{t:'All day',l:'Time off',type:'timeoff'},{t:'All day',l:'Time off',type:'timeoff'},null,null,{t:'All day',l:'Time off',type:'timeoff'}] },
    { name:'Priya Nair',     role:'Facing Up',      hours:'23h', shifts:[{t:'9:00 AM–2:00 PM',l:'Facing Up',type:'highlight'},{t:'2:00 PM–7:00 PM',l:'Cashier 1 PM',type:'shift'},{t:'All day',l:'Time off',type:'timeoff'},{t:'All day',l:'Time off',type:'timeoff'},{t:'8:00 AM–2:00 PM',l:'Cashier 1 AM',type:'shift'},{t:'11:00 AM–7:00 PM',l:'Cashier 3',type:'shift'},{t:'All day',l:'Time off',type:'timeoff'}] },
    { name:'Grace Oduya',    role:'Cashier',        hours:'29h', shifts:[{t:'2:30 PM–7:00 PM',l:'Cashier 2 PM',type:'shift'},{t:'All day',l:'Time off',type:'timeoff'},{t:'9:00 AM–2:00 PM',l:'Facing Up',type:'highlight'},{t:'2:00 PM–7:00 PM',l:'Cashier 1 PM',type:'shift'},{t:'12:00 PM–7:00 PM',l:'Cashier 3',type:'shift'},{t:'2:30 PM–7:00 PM',l:'Cashier 2 PM',type:'shift'},{t:'9:00 AM–1:00 PM',l:'Cashier 1 AM',type:'shift'}] },
    { name:'Tomasz Wojcik',  role:'Invoicing',      hours:'53h', shifts:[{t:'All day',l:'Time off',type:'timeoff'},{t:'8:00 AM–5:00 PM',l:'Invoicing',type:'invoice'},{t:'8:00 AM–7:00 PM',l:'Invoicing',type:'invoice'},{t:'8:00 AM–7:00 PM',l:'Invoicing',type:'invoice'},{t:'10:00 AM–7:00 PM',l:'Invoicing',type:'invoice'},{t:'8:00 AM–7:00 PM',l:'Invoicing',type:'invoice'},{t:'9:00 AM–5:00 PM',l:'Invoicing',type:'invoice'}] },
    { name:'Simran Kaur',    role:'Warehouse',      hours:'0h',  shifts:[null,null,null,null,null,null,null] },
  ];

  function initials(name){
    return name.split(' ').map(p=>p[0]).slice(0,2).join('').toUpperCase();
  }

  function chipHtml(shift){
    if (!shift) return '';
    return `<div class="chip ${shift.type}"><div class="t">${shift.t}</div><div class="l">${shift.l}</div></div>`;
  }

  const body = document.getElementById('grid-body');
  employees.forEach(emp => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="namecol">
        <div class="employee">
          <div class="initials">${initials(emp.name)}</div>
          <div class="meta">
            <div class="n">${emp.name}</div>
            <div class="h">${emp.hours} scheduled</div>
          </div>
        </div>
      </td>
      ${emp.shifts.map(s => `<td class="daycell">${chipHtml(s)}</td>`).join('')}
    `;
    body.appendChild(tr);
  });

  // Simple non-functional per-day totals row for visual completeness
  const totalsRow = document.getElementById('totals-row');
  const dailyTotals = ['14h 30m','22h 45m','25h 30m','20h 15m','25h','27h 30m','11h'];
  dailyTotals.forEach(t => {
    const td = document.createElement('td');
    td.textContent = t;
    totalsRow.appendChild(td);
  });

  // Prev/Next week buttons are visual-only placeholders here — wire them to
  // reload this page with a ?week=YYYY-MM-DD param against the real backend.
  document.getElementById('prev-week').addEventListener('click', () => {});
  document.getElementById('next-week').addEventListener('click', () => {});
</script>
</body>
</html>
